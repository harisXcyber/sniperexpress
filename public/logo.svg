<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <!-- Truck body -->
  <rect x="2" y="28" width="68" height="32" rx="3" fill="#0a0f1e"/>
  <rect x="52" y="20" width="18" height="12" rx="2" fill="#0a0f1e"/>
  <!-- Truck cab window -->
  <rect x="54" y="22" width="14" height="8" rx="1.5" fill="#fb923c" opacity="0.9"/>
  <!-- Truck wheels -->
  <circle cx="16" cy="62" r="7" fill="#1e293b"/>
  <circle cx="16" cy="62" r="4" fill="#475569"/>
  <circle cx="58" cy="62" r="7" fill="#1e293b"/>
  <circle cx="58" cy="62" r="4" fill="#475569"/>
  <!-- Truck cargo lines -->
  <line x1="10" y1="38" x2="50" y2="38" stroke="#334155" stroke-width="1.5"/>
  <line x1="10" y1="46" x2="50" y2="46" stroke="#334155" stroke-width="1.5"/>
  <!-- Orange stripe on truck -->
  <rect x="2" y="28" width="50" height="4" rx="1" fill="#ea580c" opacity="0.8"/>

  <!-- Bike -->
  <ellipse cx="96" cy="58" rx="8" ry="8" fill="none" stroke="#0a0f1e" stroke-width="2.5"/>
  <ellipse cx="118" cy="58" rx="8" ry="8" fill="none" stroke="#0a0f1e" stroke-width="2.5"/>
  <ellipse cx="96" cy="58" rx="4" ry="4" fill="#475569"/>
  <ellipse cx="118" cy="58" rx="4" ry="4" fill="#475569"/>
  <!-- Bike frame -->
  <path d="M96 58 L107 42 L118 58 L107 54 Z" fill="#0a0f1e"/>
  <!-- Bike handlebar -->
  <path d="M118 50 Q122 46 124 48" stroke="#0a0f1e" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Rider -->
  <circle cx="109" cy="37" r="5" fill="#ea580c"/>
  <path d="M107 42 Q109 46 111 42" fill="#ea580c"/>

  <!-- Crosshair / target on bike wheel area - small -->
  <circle cx="96" cy="58" r="8" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.4"/>
  <line x1="92" y1="58" x2="100" y2="58" stroke="#ea580c" stroke-width="1" opacity="0.6"/>
  <line x1="96" y1="54" x2="96" y2="62" stroke="#ea580c" stroke-width="1" opacity="0.6"/>

  <!-- SNIPEREXPRESS text -->
  <text x="136" y="47" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#0a0f1e">SNIPER</text>
  <text x="136" y="68" font-family="'Inter', 'Arial Black', sans-serif" font-weight="900" font-size="22" letter-spacing="-0.5" fill="#ea580c">EXPRESS</text>

  <!-- Tagline dot -->
  <circle cx="132" cy="62" r="3" fill="#ea580c"/>
</svg>
